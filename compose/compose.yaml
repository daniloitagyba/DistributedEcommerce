name: local-distributed-lab

x-api-common: &api-common
  image: local-distributed-lab/orders-api:milestone-7
  profiles: ["compose-apps"]
  restart: unless-stopped
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    ConnectionStrings__Orders: Host=postgres;Port=5432;Database=orders;Username=orders;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    Kafka__BootstrapServers: kafka:9092
    Kafka__OrderCreatedTopic: orders.created.v1
    Kafka__ClientId: orders-api
  depends_on:
    migrations:
      condition: service_completed_successfully
    kafka-init:
      condition: service_completed_successfully
  networks:
    - frontend
    - backend
  mem_limit: 256m
  cpus: 0.50
  stop_grace_period: 20s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=100
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=orders --dbname=orders"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.10
    mem_limit: 512m
    cpus: 1.5
    stop_grace_period: 30s

  kafka:
    image: apache/kafka:4.1.1
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_K8S://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_K8S://kafka.orders-lab.svc.cluster.local:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_K8S:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 134217728
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9092'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.11
    mem_limit: 768m
    cpus: 1.00
    stop_grace_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.13
    mem_limit: 128m
    cpus: 0.25
    stop_grace_period: 10s

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    restart: unless-stopped
    command: ["-host=0.0.0.0", "-config=/etc/toxiproxy/proxies.json"]
    volumes:
      - ./toxiproxy/proxies.json:/etc/toxiproxy/proxies.json:ro
    ports:
      - "127.0.0.1:${TOXIPROXY_ADMIN_PORT:-8474}:8474"
    networks:
      frontend:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.14
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 10s

  kafka-init:
    image: apache/kafka:4.1.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx128m
    command:
      - /bin/bash
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.created.v1 --partitions 3 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.created.dlq.v1 --partitions 1 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.result.v1 --partitions 3 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.decisions.dlq.v1 --partitions 1 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.result.dlq.v1 --partitions 1 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.projection.dlq.v1 --partitions 1 --replication-factor 1 --config retention.ms=86400000
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50

  migrations:
    profiles: ["compose-apps"]
    image: local-distributed-lab/orders-api:milestone-7
    build:
      context: ..
      dockerfile: apps/src/Orders.Api/Dockerfile
    restart: "no"
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Orders: Host=postgres;Port=5432;Database=orders;Username=orders;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Kafka__BootstrapServers: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["NONE"]
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50

  orders-api-1:
    <<: *api-common
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Orders: Host=postgres;Port=5432;Database=orders;Username=orders;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Kafka__BootstrapServers: kafka:9092
      Kafka__OrderCreatedTopic: orders.created.v1
      Kafka__ClientId: orders-api
      InstanceId: orders-api-1

  orders-api-2:
    <<: *api-common
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Orders: Host=postgres;Port=5432;Database=orders;Username=orders;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Kafka__BootstrapServers: kafka:9092
      Kafka__OrderCreatedTopic: orders.created.v1
      Kafka__ClientId: orders-api
      InstanceId: orders-api-2

  orders-worker:
    profiles: ["compose-apps"]
    image: local-distributed-lab/orders-worker:milestone-7
    build:
      context: ..
      dockerfile: apps/src/Orders.Worker/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Orders: Host=postgres;Port=5432;Database=orders;Username=orders;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Kafka__BootstrapServers: kafka:9092
      Kafka__OrderCreatedTopic: orders.created.v1
      Kafka__DeadLetterTopic: orders.created.dlq.v1
      Kafka__ConsumerGroup: orders-worker
      Kafka__ClientId: orders-worker-1
      InstanceId: orders-worker-1
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrations:
        condition: service_completed_successfully
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 30s

  payments-service:
    profiles: ["compose-apps"]
    image: local-distributed-lab/payments-service:milestone-7
    build:
      context: ..
      dockerfile: apps/src/Payments.Service/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Payments: Host=postgres;Port=5432;Database=payments;Username=orders;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Kafka__BootstrapServers: kafka:9092
      Kafka__OrderCreatedTopic: orders.created.v1
      Kafka__PaymentResultTopic: payments.result.v1
      Kafka__DeadLetterTopic: payments.decisions.dlq.v1
      Kafka__ConsumerGroup: payments-service
      Kafka__ClientId: payments-service-1
      InstanceId: payments-service-1
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 30s

  nginx:
    profiles: ["compose-apps"]
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${LAB_BIND_ADDRESS:-127.0.0.1}:${ORDERS_PORT:-8088}:8080"
    volumes:
      - ./nginx/orders.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      orders-api-1:
        condition: service_healthy
      orders-api-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=- http://127.0.0.1:8080/nginx-health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - frontend
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 10s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: -Xms128m -Xmx192m
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8080}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - frontend
      - backend
    mem_limit: 256m
    cpus: 0.50


  tempo:
    image: grafana/tempo:2.10.5
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s

  loki-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /var/loki"]
    volumes:
      - loki-data:/var/loki
    networks:
      - backend
    mem_limit: 32m
    cpus: 0.10

  loki:
    image: grafana/loki:3.6.11
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    depends_on:
      loki-init:
        condition: service_completed_successfully
    volumes:
      - ../observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/var/loki
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-config.file=/etc/loki/loki.yaml", "-verify-config=true"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_started
    networks:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.12
    mem_limit: 192m
    cpus: 0.50
    stop_grace_period: 20s

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks:
      - backend
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 10s

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - backend
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 10s

  prometheus:
    image: prom/prometheus:v3.13.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=512MB
      - --web.enable-lifecycle
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      otel-collector:
        condition: service_started
      node-exporter:
        condition: service_started
      alertmanager:
        condition: service_started
    networks:
      frontend:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.15
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s

  grafana:
    image: grafana/grafana:13.1.1
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - frontend
      - backend
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s
networks:
  frontend:
  backend:
    internal: true
  k3s-bridge:
    name: local-distributed-lab-k3s-bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres-data:
  kafka-data:
  tempo-data:
  loki-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
