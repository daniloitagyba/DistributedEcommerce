---
- name: Check whether Docker is already installed
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false

# Installing Docker itself needs root - the one step in this whole playbook
# that does. Every other role in this repo (K3s, Helm releases, cluster
# add-ons) deliberately runs as the regular user, matching every other
# script in this project's "no sudo available/needed" convention. This task
# is a no-op here because Docker is already present - written for
# reproducing the host from scratch, not because this environment can
# actually exercise the become path (no passwordless sudo configured).
- name: Install Docker Engine (only if missing)
  when: docker_check.rc != 0
  become: true
  block:
    - name: Install Docker's official convenience script
      ansible.builtin.get_url:
        url: https://get.docker.com
        dest: /tmp/get-docker.sh
        mode: "0755"

    - name: Run the Docker install script
      ansible.builtin.command: sh /tmp/get-docker.sh
      changed_when: true

    - name: Add the ansible user to the docker group
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        groups: docker
        append: true
