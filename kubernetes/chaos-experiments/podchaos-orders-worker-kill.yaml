# Milestone 31: abrupt SIGKILL of orders-worker's pod, not the graceful
# rolling restart (SIGTERM + drain) Milestone 8's resilience-test.sh
# already exercises. Complements Toxiproxy (Milestone 10 - network-level
# faults only) with a real pod-crash fault at the Kubernetes level.
# Applied ad hoc for the game day, not left running - kubectl delete
# after the experiment.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: kill-orders-worker
  namespace: orders-lab
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - orders-lab
    labelSelectors:
      app.kubernetes.io/name: orders-worker
